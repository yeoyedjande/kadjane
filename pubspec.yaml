name: kadjane
description: "Kadjane - La tontine, en toute transparence."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0

  # Formatting & i18n
  intl: ^0.20.2

  # Storage
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5

  # Platform services
  image_picker: ^1.2.3
  connectivity_plus: ^7.3.1

  # Utils
  uuid: ^4.6.0
  collection: ^1.19.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
