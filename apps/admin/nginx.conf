# Modèle traité au démarrage par l'entrypoint nginx : seul `${PORT}` est
# substitué (voir `NGINX_ENVSUBST_FILTER` dans le Dockerfile), les variables
# nginx comme `$uri` traversent intactes.
#
# Le port ne peut pas être figé : l'hébergeur impose le sien et route dessus.

server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;

  # Aucun proxy vers l'API : le back-office et le backend sont deux services
  # d'origines distinctes, et l'application appelle l'API en URL absolue
  # (`environment.production.ts`). L'origine du back-office doit donc figurer
  # dans `CORS_ORIGINS` côté backend.

  # Les fichiers versionnés par le build portent une empreinte dans leur nom :
  # ils peuvent être gardés indéfiniment.
  location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Application à page unique : toute route inconnue retombe sur index.html,
  # qui ne doit jamais être mis en cache sous peine de servir un ancien build.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
