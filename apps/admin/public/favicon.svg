<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Kadjane">
  <!-- Monogramme Kadjane, transposé de `lib/design_system/widgets/k_logo.dart` :
       dégradé vert en diagonale, K blanc, point or en bas à droite.
       Le K est tracé au trait plutôt qu'en <text> : un favicon est rendu à
       16 px et ne peut pas dépendre des polices installées. -->
  <defs>
    <linearGradient id="k" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e6b54"/>
      <stop offset="1" stop-color="#063c30"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="19.2" fill="url(#k)"/>

  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <path d="M23.5 20 V44" stroke-width="6.5"/>
    <path d="M27 32 L41 20" stroke-width="6"/>
    <path d="M27 32 L41 44" stroke-width="6"/>
  </g>

  <circle cx="48.6" cy="47.4" r="3.9" fill="#e0a33e"/>
</svg>
